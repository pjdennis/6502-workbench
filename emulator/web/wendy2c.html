<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>wendy2c</title>
  <link rel="stylesheet" href="/board.css">
</head>
<body>
  <main id="board">
    <header><h1>wendy<span class="accent">2c</span></h1></header>

    <section id="lcd-frame" aria-label="HD44780 LCD">
      <div id="lcd-bezel">
        <canvas id="lcd" width="320" height="80"></canvas>
      </div>
    </section>

    <section id="controls" aria-label="controls">
      <div class="indicator">
        <div class="led" id="led-morse" data-led="0"></div>
        <div class="indicator-label">LED &middot; PB6</div>
      </div>
      <div class="indicator">
        <div class="led led-red" id="led-control" data-led="1"></div>
        <div class="indicator-label">LED &middot; PA2</div>
      </div>
      <div class="indicator">
        <button class="btn" id="btn-press" aria-label="control button">
          <span class="btn-cap"></span>
        </button>
        <div class="indicator-label">BTN &middot; PA1</div>
      </div>
      <div class="indicator">
        <button class="btn btn-reset" id="btn-reset" aria-label="reset (RES) button">
          <span class="btn-cap">RST</span>
        </button>
        <div class="indicator-label">RESET</div>
      </div>
    </section>

    <section id="pins" aria-label="VIA 6522 pin state">
      <table id="pin-table"></table>
    </section>

    <section id="status">
      <span id="status-conn" class="dot off"></span>
      <span id="status-text">connecting&hellip;</span>
      <span id="status-clock"></span>
    </section>
  </main>
  <script src="/hd44780_a00_font.js"></script>
  <script src="/board.js"></script>
  <script src="/wendy2c.js"></script>
</body>
</html>
