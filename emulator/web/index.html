<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>6502 board</title>
  <link rel="stylesheet" href="/board.css">
</head>
<body>
  <main id="board">
    <header><h1 id="title">&nbsp;</h1></header>

    <section id="lcd-frame" aria-label="HD44780 LCD">
      <div id="lcd-bezel">
        <canvas id="lcd" width="320" height="80"></canvas>
      </div>
    </section>

    <section id="controls" aria-label="controls"></section>

    <section id="pins" aria-label="VIA 6522 pin state">
      <table id="pin-table"></table>
    </section>

    <section id="status">
      <span id="status-conn" class="dot off"></span>
      <span id="status-text">connecting&hellip;</span>
      <span id="status-clock"></span>
    </section>
  </main>
  <script src="/hd44780_a00_font.js"></script>
  <script src="/board.js"></script>
  <script src="/keyboard.js"></script>
  <script src="/machines.js"></script>
  <script>Board.start();</script>
</body>
</html>
