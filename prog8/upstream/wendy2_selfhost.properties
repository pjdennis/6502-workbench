# Custom Prog8 target for the 6502-experiments "wendy2c" machine (banked).
#
# 65C02. The program is serial-uploaded into the fixed lower-32K RAM at
# $4000 by the wendy2c boot ROM (upload_and_run_eeprom_wendy2c.s) and run
# there. The upper window $8000-$EFFF is the switchable bank area (8 RAM
# banks; see WENDY2_BANKING_TARGET_PLAN.md). $F000-$F7FF is the VIA;
# $F800-$FFFF is fixed high RAM (vectors + future OS-call stubs).
#
# Output: HD44780 LCD via the textio driver in libraries/wendy2.
cpu = 65c02
# cp437: ASCII over $00-$7f and does NOT translate \n -> CR (matches the
# emulator's LF convention). Same choice as the nmos target.
encoding = cp437
output_type = RAW
load_address = $0200
# program + BSS live entirely in the fixed lower 32K ($4000-$7FFF); the
# banked window ($8000+) is touched only via explicit windowed addresses.
memtop = $c480
bss_highram_start = 0
bss_highram_end = 0
bss_goldenram_start = 0
bss_goldenram_end = 0
# VIA + fixed high RAM + (future) OS-call ports -- never auto-allocate here.
io_regions = $f000-$ffff
# zeropage scratch (avoid $00-$2f: reserved for the PORTB shadow + bank
# state + the banking runtime's pointers).
zp_scratch_ptr = $f8
zp_scratch_b1  = $fa
zp_scratch_reg = $fb
zp_scratch_w1  = $fc
zp_scratch_w2  = $fe
zp_fullsafe    = $30-$f7
zp_kernalsafe  = $30-$f7
zp_basicsafe   = $30-$f7
virtual_registers = $02
library = ./libraries/wendy2
custom_launcher_code =
assembler_options =
