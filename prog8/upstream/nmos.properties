# Custom Prog8 target for the 6502-experiments emulator (the "nmos" machine).
# 6502/65C02, no ROM; I/O via syscall stubs the emulator installs at $F006+.
# RAW output loaded at $0200; reset vector handling done by a post-build wrap.
cpu = 6502
# cp437 (not iso): cp437's encoder does NOT translate the `\n` escape to CR,
# so `\n` stays LF ($0a) in string AND char literals -- matching p8c and the
# emulator's LF newline convention. (ConfigFileTarget hardcodes the iso/petscii
# newline->CR; cp437/atascii/c64os opt out. cp437 == iso == ASCII over $00-$7f,
# and the pipeline's strings are pure-ASCII asm text, so nothing else changes.)
encoding = cp437
output_type = RAW
load_address = $0200
memtop = $f000
bss_highram_start = 0
bss_highram_end = 0
bss_goldenram_start = 0
bss_goldenram_end = 0
# the emulator's I/O stubs + ports live at $F000..$FFFF
io_regions = $f000-$ffff
# zeropage scratch (avoid $00-$1f; the program's own vars get the rest)
zp_scratch_ptr = $f8
zp_scratch_b1  = $fa
zp_scratch_reg = $fb
zp_scratch_w1  = $fc
zp_scratch_w2  = $fe
zp_fullsafe    = $30-$f7
zp_kernalsafe  = $30-$f7
zp_basicsafe   = $30-$f7
virtual_registers = $02
library = ./libraries/nmos
custom_launcher_code =
assembler_options =
