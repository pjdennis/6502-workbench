name: CI

# Regression gate for the reorganization (docs/REORGANIZATION_PLAN.md, Phase 0).
# Every job runs one suite of tools/check_all.sh.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The firmware assembles identically on vasm 1.9f through 2.0f; pin the version
  # recorded in firmware/manifest.txt (check fails if they differ).
  VASM_URL: http://phoenix.owl.de/tags/vasm2_0e.tar.gz
  PROG8C_URL: https://github.com/irmen/prog8/releases/download/v12.1.1/prog8c-12.1.1-all.jar
  PROG8C: /tmp/prog8c.jar

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [firmware, asm1, asm2, emulator, prog8]
    steps:
      - uses: actions/checkout@v5

      - name: Build vasm6502_oldstyle
        run: |
          curl -sSfL -o /tmp/vasm.tar.gz "$VASM_URL"
          mkdir -p /tmp/vasm && tar -xzf /tmp/vasm.tar.gz -C /tmp/vasm --strip-components=1
          make -s -C /tmp/vasm CPU=6502 SYNTAX=oldstyle >/dev/null
          sudo install /tmp/vasm/vasm6502_oldstyle /usr/local/bin/
          vasm6502_oldstyle </dev/null 2>/dev/null | head -1

      - name: Install asm1 tools
        if: matrix.suite == 'asm1'
        run: command -v hexdump || (sudo apt-get update -q && sudo apt-get install -y -q bsdextrautils)

      - name: Install emulator-suite tools (playwright)
        if: matrix.suite == 'emulator'
        run: |
          pip install -q playwright
          python3 -m playwright install --with-deps chromium

      - name: Install prog8-suite tools (64tass, prog8c)
        if: matrix.suite == 'prog8'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q 64tass default-jre-headless
          curl -sSfL -o "$PROG8C" "$PROG8C_URL"

      - name: Run ${{ matrix.suite }} checks
        run: tools/check_all.sh ${{ matrix.suite }}
